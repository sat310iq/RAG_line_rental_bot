# Cloud Build config for line-webhook (uses deploy/Dockerfile.webhook).
# Called by deploy_webhook.sh — do not invoke directly.
# Prereq: gcloud artifacts repositories create cloud-run --repository-format=docker --location=asia-northeast1
substitutions:
  _IMAGE_NAME: 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run/line-webhook'
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_IMAGE_NAME', '-f', 'deploy/Dockerfile.webhook', '.']
images:
  - '$_IMAGE_NAME'
