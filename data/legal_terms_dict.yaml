# 賃貸契約・重要事項説明書に含まれる法律・不動産用語辞書
# 用途: RAG回答時に難しい用語を検出し、平易な説明をプロンプトに注入する
# 更新方法: word（検索キー）と plain（平易な説明）を追加する
#           contextは任意（用語が使われる場面の補足）

terms:
  - word: 抵当権
    plain: 建物が借金のかたになっている状態
    context: 貸主が銀行から借金をする際に設定することがある

  - word: 根抵当権
    plain: 繰り返し借金のかたにできる抵当権の一種
    context: 抵当権の一種で、上限額の範囲内で繰り返し担保として使える

  - word: 将来抵当権
    plain: 今後設定される可能性のある抵当権
    context: 現時点では設定されていないが将来設定されうる抵当権

  - word: 競売
    plain: 裁判所が建物を強制的に売ること
    context: 抵当権が実行されると建物が競売にかけられることがある

  - word: 競落
    plain: 競売で建物を買うこと
    context: 競落した人（競落人）が新しい所有者になる

  - word: 猶予期間
    plain: 明け渡しまでの準備のために認められる期間
    context: 競落人から明け渡しを求められた場合、6ヶ月の猶予期間がある

  - word: 対抗
    plain: 自分の権利を第三者に主張できること
    context: 登記がないと新しい所有者に賃借権を対抗できない場合がある

  - word: 登記
    plain: 不動産の権利関係を法務局に公式に記録すること
    context: 登記することで第三者に権利を主張できる

  - word: 所有権
    plain: 建物を自由に使い・売ることができる権利
    context: 競売により所有権が競落人に移る

  - word: 賃借権
    plain: 建物を借りて使う権利
    context: 賃借権は登記がないと競落人に対抗できない場合がある

  - word: 原状回復
    plain: 退去時に借りたときの状態に戻すこと
    context: 通常の使用による損耗は借主負担にならない

  - word: 原状回復義務
    plain: 退去時に部屋を元の状態に戻す義務
    context: 故意・過失による損傷は借主が負担する

  - word: 善管注意義務
    plain: 借りた物を丁寧に扱う義務
    context: 借主は善良な管理者として部屋を使用・管理する義務がある

  - word: 連帯保証
    plain: 借主が支払えない場合に代わりに支払う義務を負うこと
    context: 連帯保証人は借主と同等の責任を負う

  - word: 無催告解除
    plain: 催促なしに契約を即座に解除できること
    context: 重大な契約違反があった場合に適用されることがある

  - word: 契約解除
    plain: 契約を途中で終わらせること
    context: 一定の条件を満たした場合に貸主または借主が解除できる

  - word: 修繕義務
    plain: 建物を修理・維持する義務
    context: 通常は貸主が建物の修繕義務を負う

  - word: 短期解約違約金
    plain: 契約期間内に解約した場合に発生する違約金
    context: 契約書の特約に定められた期間内に解約すると発生する

  - word: 明渡し
    plain: 部屋の鍵を返して退去すること
    context: 契約終了または競落人からの要求により明渡しが必要になる
    aliases:
      - 明け渡し
