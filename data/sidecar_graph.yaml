# GraphRAG Sidecar Graph — 契約書 ↔ 重説 対応グラフ
# GRAPHRAG-POC-01 (rental_rag_poc-uye.1)
#
# 正本: data/documents/グランマーレ大分空港契約書.txt
#       data/documents/重要事項説明書.txt
#
# 設計方針:
#   重説は契約書の内容を入居者向けに説明した資料。同一トピックはグラフ上で双方向接続する。
#   ノード識別: doc_kind + cite_kind + (任意) cite_label_contains / section_id
#   動作: pool 内の retrieved doc が from にマッチ → to の chunk を 1-hop 追加
#
# 契約書のみ（重説に独立§なし）:
#   - 原状回復: 第17条 ↔ 別表第1 ↔ 設備経過年数表（MH 系）
#   - 重説 §17 は「敷金精算」であり契約 第17条（原状回復）とは別トピック
#
# 重説のみ / 弱対応（グラフ未接続）:
#   - §1 抵当権補足, §11 区域, §12 ハザード, §13–15 石綿・耐震・建物調査, §21 供託
#
# 現行アーキテクチャ:
#   - keyword→section inject (_IM_KEYWORD_SECTION_MAP) は KW-* 問いを引き続き担当
#   - graph expand は hierarchical search 後・rerank 前に pool を拡張するのみ

edges:
  # ── 契約書内（multi-hop / MH 系）────────────────────────────────────────

  # MH-01/02/03/04: 第17条（原状回復義務）↔ 別表第1
  - from:
      doc_kind: contract
      cite_kind: article
      cite_label_contains: "第17条"
    to:
      doc_kind: contract
      cite_kind: appendix
      cite_label_contains: "別表第1"
    rel: defines_restoration_annex

  - from:
      doc_kind: contract
      cite_kind: appendix
      cite_label_contains: "別表第1"
    to:
      doc_kind: contract
      cite_kind: article
      cite_label_contains: "第17条"
    rel: referenced_by_article_17

  # MH-05: 別表第1 → 設備経過年数表
  - from:
      doc_kind: contract
      cite_kind: appendix
      cite_label_contains: "別表第1"
    to:
      doc_kind: contract
      cite_kind: appendix
      cite_label_contains: "設備の経過年数"
    rel: depreciation_table_ref

  # MH-06: 特約 → 退去時クリーニング費用表
  - from:
      doc_kind: contract
      cite_kind: special_terms
    to:
      doc_kind: contract
      cite_kind: preamble_other
      cite_label_contains: "クリーニング"
    rel: cleaning_fee_ref

  # ── §2 契約期間・更新 ↔ 第2条・第18条 ───────────────────────────────────

  - from:
      doc_kind: important_matters
      section_id: "2"
    to:
      doc_kind: contract
      cite_kind: article
      cite_label_contains: "第2条"
    rel: cross_doc_contract_term

  - from:
      doc_kind: contract
      cite_kind: article
      cite_label_contains: "第2条"
    to:
      doc_kind: important_matters
      section_id: "2"
    rel: cross_doc_contract_term

  - from:
      doc_kind: important_matters
      section_id: "2"
    to:
      doc_kind: contract
      cite_kind: article
      cite_label_contains: "第18条"
    rel: cross_doc_renewal

  - from:
      doc_kind: contract
      cite_kind: article
      cite_label_contains: "第18条"
    to:
      doc_kind: important_matters
      section_id: "2"
    rel: cross_doc_renewal

  # ── §3 賃料・費用 ↔ 頭書・第4条・第5条・特約 ─────────────────────────────
  # XD-01, XD-02, KW-02/03

  - from:
